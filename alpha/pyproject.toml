[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rolebot-test-alpha"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["aiogram==3.31.0", "asyncpg==0.31.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rolebot = ["schema.sql"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC", "BLE", "LOG", "G"]
